<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTMF</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="#"><img class="logo" src="icon/logo-500x500.avif"></a>
        <div class="menu-links-container">
            <a href="#" class="menu-item">Home</a>
            <a href="#" class="menu-item">Folders</a>
            <a href="#" class="menu-item">About Us</a>
        </div>
    </header>
    <main>
        <div class="grid-container">
            <h2>DTMF</h2>
            <h4>Add new folder</h4>
            <a class="main-btn folder-btn" id="folderBtn"><img src="src\img\icons\folder-icon.avif" alt="Folder"></a>
            <input type="text" class="folder-input" id="folderName" placeholder="Folder name">
            <h4>Take a photo</h4>
            <a class="main-btn camera-btn" href="#"><img src="src\img\icons\camera-icon.avif" alt="Camera"></a>
            <div class="folders-container" id="foldersContainer"></div>
        </div>
        <div id="camera-container" style="display: none; flex-direction: column; align-items: center; margin-top: 30px; gap: 15px;">
            <video id="video-stream" autoplay playsinline style="width: 90%; max-width: 400px; border-radius: 10px; border: 2px solid #5bba2b;"></video>
            
            <button id="snap-btn" style="padding: 15px 30px; background-color: #5bba2b; color: white; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer;">Snap!</button>
            
            <canvas id="photo-canvas" style="display: none;"></canvas>
            
            <img id="photo-preview" style="display: none; width: 90%; max-width: 400px; border-radius: 10px;" alt="Your photo">
        </div>
    </main>
    <footer>

    </footer>
    <script type="module" src="src/js/main.js"></script>
    <script type="module" src="src/js/folders.js"></script>
    <script type="module" src="src/js/db.js"></script>
    <script type="module" src="src/js/ui.js"></script>
    <script src="src/js/localforage.js"></script>
</body>
</html>
