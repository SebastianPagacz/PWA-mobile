<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTMF</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <header>
        <a data-view="home" href="#"><img class="logo" src="icon/logo-500x500.avif" alt="DTMF"></a>
        <nav class="d-flex gap-3">
            <a href="#" class="menu-item" data-view="home">Home</a>
            <a href="#" class="menu-item" data-view="folders">Folders</a>
            <a href="#" class="menu-item" data-view="about">About Us</a>
        </nav>
    </header>

    <main class="container-fluid px-3">

        <div id="view-home">
            <div class="hero-banner mb-4">
                <img src="icon/logo-500x500.avif" alt="DTMF" class="hero-logo">
                <div>
                    <h2 class="fw-bold mb-1" style="color: var(--purple);">DTMF</h2>
                    <p class="hero-subtitle">Debi Tirar Mas Fotos</p>
                </div>
            </div>

            <div class="stats-row mb-4">
                <div class="stat-card">
                    <span class="stat-value" id="stat-folders">0</span>
                    <span class="stat-label">Folders</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-photos">0</span>
                    <span class="stat-label">Photos</span>
                </div>
            </div>

            <div class="mb-4 text-center">
                <p class="section-label">Take a photo</p>
                <div class="d-flex justify-content-center">
                    <a class="main-btn camera-btn" href="#"><img src="src/img/icons/camera-icon.avif" alt="Camera"></a>
                </div>
            </div>

            <div class="text-center recent-label mb-2 section-label">Recent folders</div>
            <div id="recentFolders" class="row g-2 mb-4 justify-content-center"></div>

            <div id="camera-container" class="d-none flex-column align-items-center gap-3 mb-4">
                <video id="video-stream" autoplay playsinline></video>
                <button id="snap-btn">Snap!</button>
                <canvas id="photo-canvas" class="d-none"></canvas>
                <img id="photo-preview" class="d-none" alt="Your photo">
            </div>
            <div id="map-container" class="d-none mb-4">
                <h4 class="text-center mb-2" style="font-size: 0.95rem; font-weight: 700;">Your localization</h4>
                <div id="map"></div>
            </div>
        </div>

        <div id="view-folders" class="d-none">
            <h2 class="fw-bold mb-4 text-center" style="color: var(--purple);">Folders</h2>
            <div id="foldersContainer" class="row g-2 justify-content-center"></div>
        </div>

        <div id="view-about" class="d-none">
            <h2 class="fw-bold mb-4" style="color: var(--purple);">About Us</h2>
            <p>DTMF — <em>Debi Tirar Mas Fotos</em>. A PWA for capturing and organising photos by location.</p>
        </div>

    </main>

    <footer>DTMF &copy; 2025</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="src/js/localforage.js"></script>
    <script type="module" src="src/js/main.js"></script>
    <script type="module" src="src/js/folders.js"></script>
    <script type="module" src="src/js/db.js"></script>
    <script type="module" src="src/js/ui.js"></script>
</body>
</html>
